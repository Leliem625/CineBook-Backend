# Hạ tầng chạy local: docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: cinebook
      POSTGRES_USER: cinebook
      POSTGRES_PASSWORD: cinebook
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    command: ["postgres", "-c", "wal_level=logical"]   # cần cho Debezium (giai đoạn 4)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinebook"]
      interval: 5s
      retries: 10

  adminer:
    image: adminer:5.5.1
    ports: ["8081:8080"]                # giao diện web quản lý database
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on: [postgres]

  redis:
    image: redis:7.4-alpine
    ports: ["6380:6379"]                # 6380 để không trùng Redis cài bằng Homebrew (6379)

  kafka:
    image: apache/kafka:4.0.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on: [kafka]

  mailpit:
    image: axllent/mailpit:v1.20.0
    ports: ["1025:1025", "8025:8025"]   # SMTP, giao diện web xem email

  # Giai đoạn 4: thêm Debezium (Kafka Connect) để đọc bảng outbox_event

volumes:
  pgdata:
