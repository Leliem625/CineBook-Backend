spring:
  application:
    name: cinebook
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/cinebook
    username: cinebook
    password: cinebook
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none              # schema do Flyway quản lý; chuyển sang validate khi mọi entity đã có migration
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6380                  # Redis trong Docker (6379 là Redis Homebrew)

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: cinebook
      auto-offset-reset: earliest

  mail:
    host: localhost
    port: 1025                    # Mailpit

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

cinebook:
  booking:
    hold-minutes: 10
    payment-extension-minutes: 5
    max-seats-per-booking: 8
  tmdb:
    base-url: https://api.themoviedb.org/3
    token: ${TMDB_TOKEN:}
    region: VN
    language: vi-VN
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    return-url: http://localhost:3000/dat-ve/ket-qua
  frontend-url: http://localhost:3000
